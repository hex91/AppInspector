name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 允许 workflow 创建 Release 并上传 APK
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库中没有 gradlew/wrapper jar，这里直接安装 Gradle 9.5.0
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设好），补齐编译所需组件即可
      - name: Install SDK components
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      # 打 tag（v*）发布时，用 tag 同步 build.gradle 里的版本号
      # 例：tag v1.3 -> versionName "1.3"、versionCode 13
      - name: Sync version from tag
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$(echo "$VERSION" | tr -d '.')
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" app/build.gradle
          echo "Building version $VERSION (code $VERSION_CODE)"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          fi
          NAME="AppInspector-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Built $NAME"

      # 每次构建都把 APK 存为 Artifact，可在 Actions 运行页面下载
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppInspector-debug-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      # 推送 v* tag 时，自动创建 Release 并附上 APK
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
